<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-Диктофон</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="recorder-container">
        <h1>Voice Recorder</h1>
        <div class="controls">
            <button id="recordBtn">Записати</button>
            <button id="stopBtn" disabled>Зупинити</button>
        </div>
        <div class="status" id="statusText">Готовий до роботи</div>
        
        <h2>Ваші записи</h2>
        <ul id="recordingsList"></ul>
    </div>

    <script href="app.js"></script>
</body>
</html>
